<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" fill="none" role="img" aria-label="Illustrated portrait of a HorecaPass recruiter">
  <rect width="480" height="600" fill="#F6EFE5"/>
  <circle cx="240" cy="230" r="190" fill="#F0E2D1"/>

  <!-- shoulders / blazer -->
  <path d="M60 600c0-108 80-176 180-176s180 68 180 176v0H60v0z" fill="#502D12"/>
  <path d="M60 600c0-70 36-124 88-152l40 96-30 56H60z" fill="#5C350F"/>
  <path d="M420 600c0-70-36-124-88-152l-40 96 30 56h98z" fill="#5C350F"/>
  <!-- shirt / collar -->
  <path d="M196 440l44 46 44-46-10 160h-68z" fill="#FBF7F1"/>
  <path d="M196 440l44 46-26 24-30-50z" fill="#EFE6D8"/>
  <path d="M284 440l-44 46 26 24 30-50z" fill="#EFE6D8"/>

  <!-- neck -->
  <rect x="210" y="372" width="60" height="70" rx="20" fill="#D9A679"/>

  <!-- hair back mass (sits behind the face, peeks out as a frame) -->
  <ellipse cx="240" cy="280" rx="104" ry="112" fill="#2B1710"/>
  <!-- side locks flowing past the shoulders -->
  <path d="M146 250c-14 50-18 130-6 210 10-4 20-14 24-28-10-56-14-120-2-176z" fill="#2B1710"/>
  <path d="M334 250c14 50 18 130 6 210-10-4-20-14-24-28 10-56 14-120 2-176z" fill="#2B1710"/>

  <!-- head -->
  <ellipse cx="240" cy="304" rx="88" ry="96" fill="#E3B88F"/>

  <!-- short bangs, above the eyebrows only -->
  <path d="M152 262c20-34 56-54 88-54s68 20 88 54c-16-14-54-22-88-22s-72 8-88 22z" fill="#2B1710"/>

  <!-- ears -->
  <circle cx="152" cy="306" r="12" fill="#E3B88F"/>
  <circle cx="328" cy="306" r="12" fill="#E3B88F"/>

  <!-- face -->
  <circle cx="206" cy="300" r="7" fill="#2B1710"/>
  <circle cx="274" cy="300" r="7" fill="#2B1710"/>
  <path d="M198 282q8-8 16 0" stroke="#2B1710" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M266 282q8-8 16 0" stroke="#2B1710" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M212 338q28 22 56 0" stroke="#7A4B2E" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="186" cy="324" r="10" fill="#D98E6A" opacity="0.35"/>
  <circle cx="294" cy="324" r="10" fill="#D98E6A" opacity="0.35"/>

  <!-- lapel pin accent -->
  <circle cx="300" cy="470" r="6" fill="#C9AA8C"/>
</svg>
